<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estante Bruna</title>

<!-- PWA: instalação na tela inicial -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b68">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon-32.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estante">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com logo, três abas (Lendo, Plano, Estante), conteúdo em coluna única de até 960px.
   Cada livro tem uma "capa" em cor de lombada; o peso da leitura aparece como três pontos. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf1; --ink:#17202e; --ink-2:#526074; --line:#d5dce5;
  --accent:#0f6b68; --accent-ink:#ffffff; --accent-soft:#d9efed;
  --warn:#8a4b00; --warn-bg:#fff1dc; --ok:#1f7a4d; --ok-bg:#dff3e8;
  --sp0:#1d4ed8; --sp1:#0f766e; --sp2:#b45309; --sp3:#9d174d; --sp4:#4d7c0f; --sp5:#6d28d9;
  --sp-ink:#ffffff;
  --f-display:"Quicksand","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Quicksand",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161e; --surface:#1a212c; --surface-2:#232c39; --ink:#e8edf4; --ink-2:#9aa7b8; --line:#2c3646;
    --accent:#5cd0c6; --accent-ink:#06211f; --accent-soft:#14393a;
    --warn:#f0b765; --warn-bg:#3a2b10; --ok:#6fd19b; --ok-bg:#16301f;
    --sp0:#7ea0ff; --sp1:#4fd1c5; --sp2:#f2b04a; --sp3:#f08ab4; --sp4:#a8d65a; --sp5:#b79cff;
    --sp-ink:#10151d; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:960px;margin-inline:auto;padding-block:20px 72px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* login */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.auth-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.auth-box img{width:72px;height:72px;border-radius:16px;align-self:center}
.auth-box h1{text-align:center}
.auth-box .sub{text-align:center;margin:0}
.auth-error{font-size:.88rem;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}

/* cabeçalho */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:13px;flex:none;display:block}
.brand{flex:1;min-width:150px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:.9rem;text-transform:capitalize}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:.8rem}
.who{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:.8rem;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}

/* números */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-block:22px 6px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:16px 20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* avisos */
.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.notice.info{background:var(--accent-soft);color:var(--ink)}

/* capa */
.capa{width:40px;height:56px;border-radius:3px 6px 6px 3px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:.95rem;letter-spacing:.02em;color:var(--sp-ink);box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.capa.s0{background:var(--sp0)}.capa.s1{background:var(--sp1)}.capa.s2{background:var(--sp2)}
.capa.s3{background:var(--sp3)}.capa.s4{background:var(--sp4)}.capa.s5{background:var(--sp5)}
.capa.sm{width:30px;height:42px;font-size:.78rem}

/* peso */
.wt{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--ink-2)}
.wt i{width:7px;height:7px;border-radius:50%;border:1.2px solid var(--ink-2);display:block}
.wt i.on{background:var(--ink-2)}
.pill{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.pill.reading{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.paused{background:var(--warn-bg);color:var(--warn)}

/* lendo agora */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .head{display:flex;gap:12px;min-width:0}
.card .txt{min-width:0;flex:1}
.title{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.author{color:var(--ink-2);font-size:.88rem;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar>span{transition:none}}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);flex-wrap:wrap}
.prog input[type=number]{width:84px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h2 small{font-family:var(--f-body);font-weight:400;color:var(--ink-2);font-size:.85rem}

/* plano */
.month{margin-bottom:22px}
.month .mh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.month .mh h3{margin:0;font-family:var(--f-display);font-size:1.15rem}
.month .mh span{color:var(--ink-2);font-size:.85rem}
.month .mh span.pill{font-size:.76rem}
.list{display:flex;flex-direction:column}
.rowitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rowitem .txt{min-width:0}
.rowitem .side{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rowitem select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;max-width:150px}
.rowitem .clickable{cursor:pointer;background:none;border:0;padding:0;text-align:left;display:block;width:100%}
@media (max-width:560px){
  .rowitem{grid-template-columns:auto minmax(0,1fr)}
  .rowitem .side{grid-column:1 / -1;justify-content:flex-start}
}

/* estante */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}

/* painel de edição */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center;padding:16px}.sheet{border-radius:14px}}
.sheet h2{font-family:var(--f-display);margin:0 0 14px;font-size:1.25rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.field textarea{min-height:80px;resize:vertical}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div id="auth" hidden>
  <form class="auth-box" id="loginForm">
    <img src="logo.png" alt="">
    <h1>Estante Bruna</h1>
    <p class="sub" style="text-transform:none">Mesmo login do Livro-Caixa</p>
    <div class="field"><label for="auth-email">E-mail</label><input type="email" id="auth-email" autocomplete="username" required></div>
    <div class="field"><label for="auth-password">Senha</label><input type="password" id="auth-password" autocomplete="current-password" required></div>
    <button class="btn primary" id="btn-login" type="submit">Entrar</button>
    <div class="auth-error" id="auth-error" hidden></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <img class="logo" src="logo.png" alt="Estante Bruna">
    <div class="brand">
      <h1>Estante Bruna</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="btn primary" data-action="add">Novo livro</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-action="tab" data-tab="agora" id="tab-agora">Lendo agora</button>
    <button class="tab" role="tab" data-action="tab" data-tab="plano" id="tab-plano">Plano por mês</button>
    <button class="tab" role="tab" data-action="tab" data-tab="estante" id="tab-estante">Estante</button>
  </div>

  <main id="view"></main>

  <div class="who"><span id="user-email"></span><button class="link" id="btn-logout">Sair</button></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Livro</h2>
    <div class="form">
      <div class="field full"><label for="f-title">Título</label><input id="f-title" type="text" autocomplete="off"></div>
      <div class="field full"><label for="f-author">Autor</label><input id="f-author" type="text" autocomplete="off"></div>
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status"><option value="queue">Na fila</option><option value="reading">Lendo</option><option value="paused">Pausado</option><option value="done">Lido</option></select></div>
      <div class="field"><label for="f-month">Mês planejado</label><select id="f-month"></select></div>
      <div class="field"><label for="f-weight">Peso da leitura</label>
        <select id="f-weight"><option value="leve">Leve</option><option value="medio">Médio</option><option value="denso">Denso</option></select></div>
      <div class="field"><label for="f-rating">Nota</label>
        <select id="f-rating"><option value="0">Sem nota</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
      <div class="field"><label for="f-pages">Total de páginas</label><input id="f-pages" type="number" min="0" inputmode="numeric"></div>
      <div class="field"><label for="f-read">Página atual</label><input id="f-read" type="number" min="0" inputmode="numeric"></div>
      <div class="field full"><label for="f-notes">Observações</label><textarea id="f-notes"></textarea></div>
    </div>
    <div class="foot">
      <button class="btn" id="delBtn" data-action="del" hidden>Excluir</button>
      <span style="flex:1"></span>
      <button class="btn" data-action="cancel">Cancelar</button>
      <button class="btn primary" data-action="save">Salvar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, getDoc, getDocs, limit, query, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAoPv4qk8RHjhq6QFn5voIAFbMtzzwPYc",
  authDomain: "livro-caixa-63f4a.firebaseapp.com",
  projectId: "livro-caixa-63f4a",
  storageBucket: "livro-caixa-63f4a.firebasestorage.app",
  messagingSenderId: "524566546588",
  appId: "1:524566546588:web:e9666674336e2f68d6c559",
  measurementId: "G-GEZZLXZ22H"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const fs = getFirestore(fb);

/* Livros iniciais: gravados uma única vez, no primeiro acesso.
   [id, título, autor, status, mês, peso, páginas, observações] */
const SEED = [
  ["habitos-atomicos","Hábitos Atômicos","James Clear","reading","2026-10","medio",0,""],
  ["do-mil-ao-milhao","Do Mil ao Milhão sem Cortar o Cafezinho","Thiago Nigro","reading","2026-10","medio",0,""],
  ["colecionador-de-lagrimas","O Colecionador de Lágrimas","","reading","2026-10","leve",0,""],
  ["homem-mais-rico-babilonia","O Homem Mais Rico da Babilônia","George S. Clason","queue","2026-10","leve",0,"Combina com Do Mil ao Milhão."],

  ["rapido-devagar","Rápido e devagar","Daniel Kahneman","queue","2027-02","denso",0,"Já comprado."],

  ["cidadania-classe-status","Cidadania, classe social e status","T. H. Marshall","queue","","medio",0,"Ler antes de Cidadania no Brasil."],

  ["brasil-biografia","Brasil: uma biografia","Lilia Schwarcz e Heloisa Starling","queue","","denso",0,"Cerca de 700 páginas. Ler aos poucos ou por capítulos."],
  ["cidadania-no-brasil","Cidadania no Brasil: o longo caminho","José Murilo de Carvalho","queue","","medio",0,""],

  ["projeto-paixao","Projeto Paixão","London Sperry","queue","","leve",0,""],

  ["se-nao-puder-dancar","Se não puder dançar, cante!","Alexia Casale","queue","","leve",0,""],
  ["sem-saida","Sem saída","Elsie Silver","queue","","leve",0,"Chestnut Springs, livro 5. Se quiser ler a série, começar por Sem defeitos."],
  ["coisas-desacelera","As coisas que você só vê quando desacelera","Haemin Sunim","queue","","leve",253,"Uma página por dia, em paralelo com outro livro. Edição capa dura, ISBN 9788543105291."],
  ["caracol-lento","O caracol é lento, mas nunca se atrasa","Jung-mok","queue","","leve",0,"Uma página por dia, em paralelo com outro livro."]

const STATUS = {reading:'Lendo', queue:'Na fila', paused:'Pausado', done:'Lido'};
const WEIGHT = {leve:['Leve',1], medio:['Médio',2], denso:['Denso',3]};
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const LIMIT = 3;
const LS_TAB = 'estante-bruna-tab';

let books = [], uid = null, loaded = false, unsub = null;
let tab = 'agora', filter = 'all', queryText = '';
let editingId = null, delArmed = false, toastTimer = null;
const chain = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel = (m) => { const p = m.split('-'); return MONTHS[+p[1]-1] + ' ' + p[0]; };
function monthKeys(){
  const set = new Set();
  for(let i=0;i<15;i++){ const d = new Date(2026, 9+i, 1); set.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  books.forEach((b) => { if(b.month) set.add(b.month); });
  return [...set].sort();
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; }
function initials(t){
  const skip = new Set(['a','o','as','os','de','do','da','dos','das','e','um','uma','no','na','sem']);
  let w = String(t).split(/\s+/).filter((x) => x && !skip.has(x.toLowerCase()));
  if(!w.length) w = String(t).split(/\s+/);
  return ((w[0]||'?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
const capa = (b, sm) => `<div class="capa s${hash(b.title||'')%6}${sm?' sm':''}" aria-hidden="true">${esc(initials(b.title||'?'))}</div>`;
function weightEl(w){
  const d = WEIGHT[w] || WEIGHT.medio; let h = '';
  for(let i=1;i<=3;i++) h += `<i${i<=d[1]?' class="on"':''}></i>`;
  return `<span class="wt" title="Leitura ${d[0].toLowerCase()}">${h}<span>${d[0]}</span></span>`;
}
const pct = (b) => b.pages > 0 ? Math.min(100, Math.round((b.read||0) / b.pages * 100)) : null;
const sortBooks = (a,b) => (a.order||0) - (b.order||0) || String(a.title).localeCompare(String(b.title),'pt-BR');
const byId = (id) => books.find((b) => b.id === id);
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- Firestore: users/{uid}/books/{id} ---------- */
const booksCol = () => collection(fs, 'users', uid, 'books');
function clean(b){ const o = {}; Object.keys(b).forEach((k) => { if(k !== 'id' && b[k] !== undefined) o[k] = b[k]; }); return o; }
function saveBook(b){
  const run = () => setDoc(doc(fs, 'users', uid, 'books', b.id), clean(b));
  chain[b.id] = (chain[b.id] || Promise.resolve()).then(run).catch((e) => toast('Não foi possível salvar' + (e && e.code ? ' ('+e.code+')' : '') + '.'));
  return chain[b.id];
}
function removeBook(id){
  return deleteDoc(doc(fs, 'users', uid, 'books', id)).catch(() => toast('Não foi possível excluir.'));
}
function patch(id, p){
  const b = byId(id); if(!b) return;
  return saveBook(Object.assign({}, b, p));
}
async function seedIfNeeded(){
  const flag = doc(fs, 'users', uid, 'settings', 'estante');
  const s = await getDoc(flag);
  if(s.exists() && s.data().seeded) return;
  const any = await getDocs(query(booksCol(), limit(1)));
  if(any.empty){
    const batch = writeBatch(fs);
    SEED.forEach((r, i) => {
      batch.set(doc(fs, 'users', uid, 'books', r[0]), {
        title:r[1], author:r[2], status:r[3], month:r[4], weight:r[5], pages:r[6], read:0, rating:0, notes:r[7], order:i+1
      });
    });
    await batch.commit();
  }
  await setDoc(flag, {seeded:true}, {merge:true});
}

/* ---------- renderização ---------- */
function renderStats(){
  const reading = books.filter((b) => b.status === 'reading').length;
  const queue = books.filter((b) => b.status === 'queue').length;
  const yr = String(new Date().getFullYear());
  const done = books.filter((b) => b.status === 'done' && String(b.finishedAt||'').indexOf(yr) === 0).length;
  $('stats').innerHTML =
    `<div class="stat"><b>${reading}/${LIMIT}</b><span>Lendo</span></div>` +
    `<div class="stat"><b>${queue}</b><span>Na fila</span></div>` +
    `<div class="stat"><b>${done}</b><span>Lidos em ${yr}</span></div>`;
}
function renderTabs(){ ['agora','plano','estante'].forEach((t) => $('tab-'+t).setAttribute('aria-selected', String(t === tab))); }

function readingCard(b){
  const p = pct(b); let prog;
  if(b.pages > 0){
    prog = `<div class="prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div>` +
      `<div class="row"><span>página <input type="number" min="0" max="${b.pages}" value="${b.read||0}" data-page="${esc(b.id)}" aria-label="Página atual de ${esc(b.title)}"> de ${b.pages}</span><span style="font-family:var(--f-mono)">${p}%</span></div></div>`;
  } else {
    prog = `<div class="prog"><div class="row"><span>Sem total de páginas.</span><button class="link" data-action="edit" data-id="${esc(b.id)}">Definir páginas</button></div></div>`;
  }
  return `<article class="card"><div class="head">${capa(b)}<div class="txt"><div class="title">${esc(b.title)}</div>` +
    (b.author ? `<div class="author">${esc(b.author)}</div>` : '') +
    `<div class="meta">${weightEl(b.weight)}${b.month ? `<span class="pill">${esc(monthLabel(b.month))}</span>` : ''}</div></div></div>` +
    prog +
    (b.notes ? `<div class="author">${esc(b.notes)}</div>` : '') +
    `<div class="actions"><button class="btn small primary" data-action="finish" data-id="${esc(b.id)}">Concluir</button>` +
    `<button class="btn small" data-action="pause" data-id="${esc(b.id)}">Pausar</button>` +
    `<button class="btn small" data-action="edit" data-id="${esc(b.id)}">Editar</button></div></article>`;
}
function queueMini(b){
  return `<div class="rowitem">${capa(b,true)}<div class="txt"><div class="title" style="font-size:.98rem">${esc(b.title)}</div><div class="author">${esc(b.author||'')}${b.month?' · '+esc(monthLabel(b.month)):''}</div></div>` +
    `<div class="side">${weightEl(b.weight)}<button class="btn small primary" data-action="start" data-id="${esc(b.id)}">Começar</button></div></div>`;
}
function viewAgora(){
  const reading = books.filter((b) => b.status === 'reading').sort(sortBooks);
  const paused = books.filter((b) => b.status === 'paused').sort(sortBooks);
  let h = '';
  if(reading.length > LIMIT) h += `<div class="notice">Você está com ${reading.length} livros em andamento. O combinado era no máximo ${LIMIT}. Termine ou pause algum antes de começar outro.</div>`;
  if(reading.filter((b) => b.weight === 'denso').length >= 2) h += '<div class="notice">Dois livros densos ao mesmo tempo. Vale deixar um deles para depois.</div>';
  h += reading.length ? `<div class="grid">${reading.map(readingCard).join('')}</div>` : '<div class="empty">Nenhum livro em andamento.</div>';
  if(reading.length < LIMIT){
    const next = books.filter((b) => b.status === 'queue').sort((a,b) => {
      const am = a.month || '9999', bm = b.month || '9999';
      return am < bm ? -1 : am > bm ? 1 : sortBooks(a,b);
    }).slice(0, 3);
    if(next.length) h += `<div class="h2">Próximos da fila <small>cabem mais ${LIMIT-reading.length} em andamento</small></div><div class="list">${next.map(queueMini).join('')}</div>`;
  }
  if(paused.length) h += `<div class="h2">Pausados</div><div class="list">${paused.map((b) =>
    `<div class="rowitem">${capa(b,true)}<div class="txt"><div class="title" style="font-size:.98rem">${esc(b.title)}</div><div class="author">${esc(b.author||'')}</div></div><div class="side"><button class="btn small" data-action="start" data-id="${esc(b.id)}">Retomar</button></div></div>`).join('')}</div>`;
  return h;
}
function monthSelect(b){
  const opts = '<option value="">Sem mês</option>' + monthKeys().map((m) => `<option value="${m}"${b.month === m ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
  return `<select data-month="${esc(b.id)}" aria-label="Mês de ${esc(b.title)}">${opts}</select>`;
}
function planRow(b){
  return `<div class="rowitem">${capa(b,true)}<div class="txt"><button class="clickable" data-action="edit" data-id="${esc(b.id)}"><span class="title" style="font-size:.98rem">${esc(b.title)}</span><span class="author" style="display:block">${esc(b.author||'')}</span></button></div>` +
    `<div class="side">${weightEl(b.weight)}${b.status !== 'queue' ? `<span class="pill ${b.status}">${STATUS[b.status]}</span>` : ''}${monthSelect(b)}</div></div>`;
}
function viewPlano(){
  const open = books.filter((b) => b.status !== 'done').sort(sortBooks);
  if(!open.length) return '<div class="empty">Nada planejado ainda. Use "Novo livro" para começar.</div>';
  const groups = {}, loose = [];
  open.forEach((b) => { if(b.month){ (groups[b.month] = groups[b.month] || []).push(b); } else loose.push(b); });
  let h = Object.keys(groups).sort().map((m) => {
    const g = groups[m], dense = g.filter((b) => b.weight === 'denso').length;
    return `<section class="month"><div class="mh"><h3>${monthLabel(m)}</h3><span>${g.length}${g.length === 1 ? ' livro' : ' livros'}</span>` +
      (dense >= 2 ? `<span class="pill paused">${dense} densos no mesmo mês</span>` : '') +
      `</div><div class="list">${g.map(planRow).join('')}</div></section>`;
  }).join('');
  if(loose.length) h += `<section class="month"><div class="mh"><h3>Sem mês definido</h3><span>${loose.length}${loose.length === 1 ? ' livro' : ' livros'}</span></div><div class="list">${loose.map(planRow).join('')}</div></section>`;
  return h;
}
function viewEstante(){
  const counts = {all: books.length};
  Object.keys(STATUS).forEach((s) => { counts[s] = books.filter((b) => b.status === s).length; });
  const q = queryText.trim().toLowerCase();
  const list = books.filter((b) => {
    if(filter !== 'all' && b.status !== filter) return false;
    return !q || (String(b.title)+' '+String(b.author||'')).toLowerCase().indexOf(q) >= 0;
  }).sort(sortBooks);
  const chips = [['all','Todos']].concat(Object.keys(STATUS).map((s) => [s, STATUS[s]])).map((c) =>
    `<button class="chip" data-action="filter" data-f="${c[0]}" aria-pressed="${filter === c[0]}">${c[1]}<b>${counts[c[0]]}</b></button>`).join('');
  const rows = list.map((b) => {
    const p = pct(b);
    return `<div class="rowitem">${capa(b,true)}<div class="txt"><button class="clickable" data-action="edit" data-id="${esc(b.id)}"><span class="title" style="font-size:.98rem">${esc(b.title)}</span><span class="author" style="display:block">${esc(b.author||'')}</span></button></div>` +
      `<div class="side">${weightEl(b.weight)}${b.status === 'done' && b.rating ? `<span class="pill" style="font-family:var(--f-mono)">${b.rating}/5</span>` : (b.status === 'reading' && p != null ? `<span class="pill reading" style="font-family:var(--f-mono)">${p}%</span>` : '')}<span class="pill ${b.status}">${STATUS[b.status]}</span></div></div>`;
  }).join('');
  return `<div class="toolbar"><input type="search" id="q" placeholder="Buscar por título ou autor" value="${esc(queryText)}" aria-label="Buscar livro"></div>` +
    `<div class="chips" style="margin-bottom:10px">${chips}</div>` +
    (rows ? `<div class="list">${rows}</div>` : '<div class="empty">Nenhum livro encontrado.</div>');
}
function render(){
  const act = document.activeElement, keep = act && act.id === 'q' ? act.selectionStart : null;
  renderStats(); renderTabs();
  let h = '';
  if(!loaded) h = '<div class="empty">Carregando sua estante…</div>';
  else if(!books.length) h = '<div class="empty">A estante está vazia. Use "Novo livro" para cadastrar o primeiro.</div>';
  else h = tab === 'agora' ? viewAgora() : tab === 'plano' ? viewPlano() : viewEstante();
  $('view').innerHTML = h;
  if(keep != null){ const q = $('q'); if(q){ q.focus(); try{ q.setSelectionRange(keep, keep); }catch(e){} } }
}

/* ---------- painel de edição ---------- */
function openSheet(id){
  editingId = id || null; delArmed = false;
  const b = id ? byId(id) : {status:'queue', weight:'medio', month:'', pages:'', read:'', rating:0, title:'', author:'', notes:''};
  if(!b) return;
  $('sheetTitle').textContent = id ? 'Editar livro' : 'Novo livro';
  $('f-title').value = b.title || '';
  $('f-author').value = b.author || '';
  $('f-status').value = b.status || 'queue';
  $('f-weight').value = b.weight || 'medio';
  $('f-rating').value = String(b.rating || 0);
  $('f-pages').value = b.pages || '';
  $('f-read').value = b.read || '';
  $('f-notes').value = b.notes || '';
  $('f-month').innerHTML = '<option value="">Sem mês</option>' + monthKeys().map((m) => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  $('f-month').value = b.month || '';
  const d = $('delBtn'); d.hidden = !id; d.textContent = 'Excluir';
  $('overlay').hidden = false;
  setTimeout(() => $('f-title').focus(), 30);
}
function closeSheet(){ $('overlay').hidden = true; editingId = null; }
function submitSheet(){
  const title = $('f-title').value.trim();
  if(!title){ toast('Escreva o título do livro.'); $('f-title').focus(); return; }
  const old = editingId ? byId(editingId) : null;
  const status = $('f-status').value;
  const pages = parseInt($('f-pages').value, 10) || 0;
  const read = parseInt($('f-read').value, 10) || 0;
  const slug = title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  const b = {
    id: old ? old.id : (slug || 'livro') + '-' + Math.random().toString(36).slice(2,6),
    title, author: $('f-author').value.trim(), status,
    month: $('f-month').value, weight: $('f-weight').value, pages, read,
    rating: parseInt($('f-rating').value, 10) || 0, notes: $('f-notes').value.trim(),
    order: old ? (old.order || 0) : (books.reduce((m,x) => Math.max(m, x.order||0), 0) + 1),
    startedAt: old ? old.startedAt : undefined, finishedAt: old ? old.finishedAt : undefined
  };
  if(status === 'reading' && !b.startedAt) b.startedAt = todayISO();
  if(status === 'done'){ if(!b.finishedAt) b.finishedAt = todayISO(); if(pages && read < pages) b.read = pages; }
  if(status !== 'done') b.finishedAt = undefined;
  saveBook(b); closeSheet();
}

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
  if(a === 'tab'){ tab = el.getAttribute('data-tab'); try{ localStorage.setItem(LS_TAB, tab); }catch(x){} render(); }
  else if(a === 'filter'){ filter = el.getAttribute('data-f'); render(); }
  else if(a === 'add') openSheet(null);
  else if(a === 'edit') openSheet(id);
  else if(a === 'cancel') closeSheet();
  else if(a === 'save') submitSheet();
  else if(a === 'del'){
    if(!delArmed){ delArmed = true; el.textContent = 'Confirmar exclusão'; }
    else { const rid = editingId; closeSheet(); removeBook(rid); }
  }
  else if(a === 'start'){
    const n = books.filter((b) => b.status === 'reading').length;
    const bk = byId(id); patch(id, {status:'reading', startedAt: (bk && bk.startedAt) || todayISO()});
    if(n >= LIMIT) toast('Você já tinha ' + n + ' livros em andamento.');
  }
  else if(a === 'pause') patch(id, {status:'paused'});
  else if(a === 'finish'){ const f = byId(id); patch(id, {status:'done', finishedAt: todayISO(), read: f && f.pages ? f.pages : (f && f.read) || 0}); toast('Livro concluído.'); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if(t.hasAttribute('data-month')) patch(t.getAttribute('data-month'), {month: t.value});
  else if(t.hasAttribute('data-page')){
    const b = byId(t.getAttribute('data-page')); if(!b) return;
    patch(b.id, {read: Math.max(0, Math.min(parseInt(t.value, 10) || 0, b.pages || 1e6))});
  }
});
document.addEventListener('input', (e) => { if(e.target.id === 'q'){ queryText = e.target.value; render(); } });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });
$('overlay').addEventListener('click', (e) => { if(e.target === $('overlay')) closeSheet(); });

/* ---------- login ---------- */
function authError(err){
  const map = {
    'auth/invalid-email':'E-mail inválido.', 'auth/user-not-found':'Usuário não encontrado.',
    'auth/wrong-password':'Senha incorreta.', 'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/missing-password':'Digite a senha.', 'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.'
  };
  return map[err.code] || 'Erro: ' + (err.code || err.message);
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = $('auth-error'), btn = $('btn-login');
  box.hidden = true; btn.disabled = true;
  try{ await signInWithEmailAndPassword(auth, $('auth-email').value.trim(), $('auth-password').value); }
  catch(err){ box.textContent = authError(err); box.hidden = false; }
  finally{ btn.disabled = false; }
});
$('btn-logout').addEventListener('click', () => signOut(auth));

try{ const t0 = localStorage.getItem(LS_TAB); if(t0 === 'agora' || t0 === 'plano' || t0 === 'estante') tab = t0; }catch(e){}
$('sub').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});

onAuthStateChanged(auth, async (user) => {
  if(unsub){ unsub(); unsub = null; }
  if(!user){
    uid = null; books = []; loaded = false;
    $('app').hidden = true; $('auth').hidden = false; $('auth-password').value = '';
    return;
  }
  uid = user.uid;
  $('auth').hidden = true; $('app').hidden = false;
  $('user-email').textContent = user.email || '';
  render();
  try{ await seedIfNeeded(); }catch(e){ toast('Não consegui carregar os livros iniciais.'); }
  unsub = onSnapshot(booksCol(), (snap) => {
    books = snap.docs.map((d) => Object.assign({id: d.id}, d.data()));
    loaded = true; render();
  }, () => { loaded = true; render(); toast('Não consegui ler os livros. Verifique a conexão.'); });
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
